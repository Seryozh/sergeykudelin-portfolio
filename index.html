<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Sergey Kudelin. Product, GTM, and systems.">
  <meta name="theme-color" content="#F2EFE7">
  <title>Sergey Kudelin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F2EFE7'/%3E%3Cpath d='M15 0h2v32h-2z' fill='%23F04B2F'/%3E%3C/svg%3E">
  <style>
    :root {
      --color-field: #F2EFE7;
      --color-ink: #11100E;
      --color-signal: #F04B2F;
      --color-quiet: #6F6B65;
      --font-display: Arial, "Helvetica Neue", Helvetica, sans-serif;
      --font-text: Arial, "Helvetica Neue", Helvetica, sans-serif;
      --page-gutter: clamp(1.125rem, 3vw, 3.5rem);
      --pad-left: max(var(--page-gutter), env(safe-area-inset-left));
      --pad-right: max(var(--page-gutter), env(safe-area-inset-right));
      --pad-top: max(var(--page-gutter), env(safe-area-inset-top));
      --pad-bottom: max(var(--page-gutter), env(safe-area-inset-bottom));
      --seam-width: 2px;
      --seam-x: clamp(57vw, calc(63.43vw - 20.57px), 62vw);
      --seam-local: calc(var(--seam-x) - var(--pad-left));
      --registration-shift: clamp(0.75rem, 1.5vw, 1.5rem);
      --motion-duration: 820ms;
      --motion-delay: 120ms;
      --motion-ease: cubic-bezier(.16, 1, .3, 1);
      --mark-size: min(19rem, calc((100vw - var(--pad-left) - var(--pad-right)) / 4.9), 29svh);
      --funnel-width: clamp(8rem, calc(var(--seam-x) - var(--pad-left) - 1rem), 24rem);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--color-field);
    }

    body {
      min-block-size: 100vh;
      min-block-size: 100svh;
      margin: 0;
      background: var(--color-field);
      color: var(--color-ink);
      font-family: var(--font-text);
      text-rendering: geometricPrecision;
    }

    .identity {
      position: relative;
      min-block-size: 100vh;
      min-block-size: 100svh;
      isolation: isolate;
    }

    .label {
      position: absolute;
      z-index: 5;
      margin: 0;
      color: var(--color-quiet);
      font-size: clamp(0.6875rem, 0.7vw, 0.8125rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      max-inline-size: calc(100vw - var(--pad-left) - var(--pad-right));
    }

    .territory {
      inset-block-start: var(--pad-top);
      inset-inline-end: var(--pad-right);
      text-align: end;
    }

    .prompt {
      position: absolute;
      z-index: 5;
      inset-block-end: calc(var(--pad-bottom) + 3rem);
      inset-inline-start: var(--pad-left);
      inline-size: var(--funnel-width);
      margin: 0;
      color: var(--color-ink);
      font-size: clamp(0.9375rem, 1.25vw, 1.125rem);
      font-weight: 600;
      line-height: 1.25;
      overflow-wrap: break-word;
    }

    .contact {
      position: absolute;
      z-index: 5;
      inset-block-end: calc(var(--pad-bottom) - 0.75rem);
      inset-inline-start: var(--pad-left);
      display: inline-flex;
      inline-size: var(--funnel-width);
      min-block-size: 44px;
      align-items: center;
      padding: 0.75rem 0 0.5rem;
      color: var(--color-ink);
      font-size: clamp(0.75rem, 0.85vw, 0.875rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.04em;
      max-inline-size: var(--funnel-width);
      overflow-wrap: anywhere;
      text-decoration: none;
    }

    .contact::after {
      position: absolute;
      inset-inline: 0;
      inset-block-end: 0.35rem;
      block-size: 1px;
      background: var(--color-ink);
      content: "";
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 180ms var(--motion-ease);
    }

    .contact:is(:hover, :focus, :focus-visible)::after {
      transform: scaleX(1);
    }

    .contact:focus-visible {
      outline: 2px solid var(--color-ink);
      outline-offset: 2px;
    }

    .mark {
      position: absolute;
      z-index: 2;
      inset-inline: var(--pad-left) var(--pad-right);
      inset-block-start: min(50%, calc(100svh - 10.25rem));
      min-block-size: calc(var(--mark-size) * 1.6);
      margin: 0;
      transform: translateY(-50%);
      color: var(--color-ink);
      font-family: var(--font-display);
      font-size: var(--mark-size);
      font-weight: 800;
      line-height: 0.8;
      letter-spacing: -0.075em;
    }

    .mark-visual,
    .plane {
      position: absolute;
      inset: 0;
    }

    .plane {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      will-change: transform;
    }

    .plane-left {
      clip-path: inset(0 calc(100% - var(--seam-local)) 0 0);
      animation: register-left var(--motion-duration) var(--motion-ease) var(--motion-delay) both;
    }

    .plane-right {
      clip-path: inset(0 0 0 var(--seam-local));
      animation: register-right var(--motion-duration) var(--motion-ease) var(--motion-delay) both;
    }

    .word {
      display: block;
      white-space: nowrap;
    }

    .seam {
      position: absolute;
      z-index: 3;
      inset-block: 0;
      inset-inline-start: var(--seam-x);
      inline-size: var(--seam-width);
      background: var(--color-signal);
      transform-origin: center;
      transition: inline-size 180ms var(--motion-ease), inset-inline-start 180ms var(--motion-ease);
      animation: register-seam var(--motion-duration) var(--motion-ease) var(--motion-delay) both;
    }

    .contact:is(:hover, :focus, :focus-visible) ~ .seam {
      inset-inline-start: calc(var(--seam-x) - 2px);
      inline-size: 6px;
    }

    .sr-only {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes register-left {
      from { transform: translate3d(calc(var(--registration-shift) * -1), 0, 0); }
      to { transform: translate3d(0, 0, 0); }
    }

    @keyframes register-right {
      from { transform: translate3d(var(--registration-shift), 0, 0); }
      to { transform: translate3d(0, 0, 0); }
    }

    @keyframes register-seam {
      from { transform: translateX(-4px) scaleX(5); }
      to { transform: translateX(0) scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .plane-left,
      .plane-right,
      .seam {
        animation: none;
      }

      .seam {
        transition: none;
      }

      .contact::after {
        transform: scaleX(1);
        transition: none;
      }

      .contact:is(:hover, :focus, :focus-visible) ~ .seam {
        inset-inline-start: var(--seam-x);
        inline-size: var(--seam-width);
      }
    }

    @media (forced-colors: active) {
      .seam {
        background: CanvasText;
      }

      .label,
      .contact,
      .mark {
        color: CanvasText;
      }

      .contact:focus-visible {
        outline-color: Highlight;
      }

      .contact::after {
        background: CanvasText;
      }
    }

    @media print {
      .identity {
        min-block-size: 100vh;
      }

      .plane-left,
      .plane-right,
      .seam {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="identity">
    <p class="label territory">PRODUCT / GTM / SYSTEMS</p>
    <h1 class="mark">
      <span class="sr-only">SERGEY KUDELIN</span>
      <span class="mark-visual" aria-hidden="true">
        <span class="plane plane-left">
          <span class="word">SERGEY</span>
          <span class="word">KUDELIN</span>
        </span>
        <span class="plane plane-right">
          <span class="word">SERGEY</span>
          <span class="word">KUDELIN</span>
        </span>
      </span>
    </h1>
    <div class="funnel">
      <p class="prompt">You clicked. <wbr>What brought you here?</p>
      <a class="contact" href="mailto:sergey@sergeykudelin.com?subject=Why%20I%20clicked&amp;body=Sergey%2C%0D%0A%0D%0AI%20found%20you%20through%3A%0D%0A%0D%0AI%20clicked%20because%3A%0D%0A%0D%0AI%27m%20working%20on%3A%0D%0A">Tell me by <wbr>email <span aria-hidden="true">↗</span></a>
      <span class="seam" aria-hidden="true"></span>
    </div>
  </main>
</body>
</html>
