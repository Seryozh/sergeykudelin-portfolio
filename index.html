<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Next Customer | Built by Sergey Kudelin</title>
  <meta name="description" content="I'm building Next Customer to help YC-backed startups find their next customers. Connect with Sergey Kudelin on LinkedIn.">
  <meta name="theme-color" content="#071e3b">
  <link rel="canonical" href="https://sergeykudelin.com/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Next Customer">
  <meta property="og:title" content="Meet your next customer.">
  <meta property="og:description" content="I'm building Next Customer to help YC-backed startups find their next customers. Website in progress.">
  <meta property="og:url" content="https://sergeykudelin.com/">
  <meta property="og:image" content="https://sergeykudelin.com/assets/next-customer.png">
  <meta property="og:image:width" content="1254">
  <meta property="og:image:height" content="1254">
  <meta property="og:image:alt" content="The blue Next Customer doorway opens onto a white path.">
  <meta name="twitter:card" content="summary">
  <style>
    :root{--paper:#f7f6f1;--navy:#071e3b;--ink:#091e3a;--blue:#0759ff;--muted:#526174;--white:#fff;color-scheme:light}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
    h1,p{margin:0}a{color:inherit}a:focus-visible{outline:3px solid var(--blue);outline-offset:6px}::selection{background:#c7dcff;color:var(--navy)}
    .wrap{width:min(1248px,calc(100% - 112px));margin-inline:auto}
    .skip{position:absolute;left:20px;top:-100px;z-index:9;padding:12px 20px;background:var(--white);color:var(--navy)}.skip:focus{top:16px}
    .site-header{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:112px}
    .brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0}.brand svg{display:block;width:34px;height:43px}.brand span{font-size:25px;font-weight:700;letter-spacing:-1.2px}
    .status{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}.status:before{content:"";display:block;width:6px;height:6px;background:var(--blue);border-radius:50%}
    .hero{position:relative;isolation:isolate;overflow:hidden;background:var(--navy);color:var(--white);margin-inline:24px;min-height:650px;display:flex;align-items:center}
    .hero__inner{position:relative;z-index:2;padding-block:80px 90px}.hero__copy{max-width:690px}
    .eyebrow{color:#bdcee5;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin-bottom:31px}
    h1{font-size:clamp(66px,7.1vw,102px);line-height:1;letter-spacing:-.06em;font-weight:700}h1 span{display:block}
    .description{max-width:420px;color:#dbe5f3;font-size:20px;line-height:1.55;margin-top:32px}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:26px;min-height:55px;margin-top:34px;padding:15px 21px;text-decoration:none;font-size:15px;font-weight:500;background:var(--blue);color:var(--white);border-radius:4px;transition:background .16s,transform .16s}.button:hover{background:#0048db;transform:translateY(-2px)}.button:active{transform:translateY(0)}.button:focus-visible{outline-color:var(--white)}.arrow{display:block;width:18px;height:18px;flex-shrink:0}
    .hero__art{position:absolute;z-index:0;right:-9%;top:50%;transform:translateY(-50%);width:65%;max-width:900px;pointer-events:none}.hero__art img{width:100%;height:auto;display:block}
    .site-footer{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-block:29px 35px;font-size:13px;color:var(--muted)}.site-footer a{text-decoration:none;text-underline-offset:5px}.site-footer a:hover{text-decoration:underline}.footer-name{color:var(--ink)}
    @media(min-width:1600px){.hero{max-width:1544px;margin-inline:auto}.hero__art{right:-6%;width:65%}}
    @media(max-width:1150px){.wrap{width:calc(100% - 80px)}.hero{min-height:620px}.hero__art{right:-18%;width:76%}h1{font-size:7.5vw;max-width:650px}.description{max-width:380px;font-size:18px}}
    @media(max-width:800px){.wrap{width:calc(100% - 48px)}.site-header{min-height:92px}.brand span{font-size:22px}.brand svg{width:29px;height:37px}.status{font-size:11px;gap:7px}.hero{margin-inline:12px;min-height:auto;display:block}.hero__inner{padding-top:48px;padding-bottom:0}.hero__copy{max-width:580px}h1{font-size:clamp(54px,10vw,77px);max-width:580px}.eyebrow{font-size:10px;margin-bottom:25px;letter-spacing:.105em}.description{max-width:430px;font-size:18px;margin-top:27px}.button{margin-top:28px}.hero__art{position:relative;width:85%;max-width:490px;right:auto;top:auto;transform:none;margin:-16px -6% -61px auto}.site-footer{padding-block:25px 30px;font-size:12px}}
    @media(max-width:450px){.wrap{width:calc(100% - 40px)}.site-header{gap:10px;min-height:84px}.brand{gap:8px}.brand span{font-size:20px;letter-spacing:-.8px}.brand svg{width:26px;height:34px}.status{font-size:10px;max-width:76px;line-height:1.35;gap:7px}.status:before{flex-shrink:0;width:5px;height:5px}.hero__inner{width:calc(100% - 40px);padding-top:44px}h1{font-size:clamp(43px,12.4vw,55px);line-height:1.04;letter-spacing:-.06em}.description{font-size:17px;max-width:310px;margin-top:25px}.button{min-height:53px;padding:14px 17px;font-size:14px;gap:22px}.hero__art{width:102%;margin:-11px -13% -45px auto}.site-footer{align-items:flex-start;gap:15px}.site-footer a:last-child{font-size:11px}}
    @media(prefers-reduced-motion:reduce){.button{transition:none}.button:hover{transform:none}}
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="brand" href="/" aria-label="Next Customer home">
      <svg viewBox="0 0 48 60" aria-hidden="true"><path d="M3 15 34 3v43l-8-3V16L12 11v40l-9 6Z" fill="#0759ff"/><path d="m12 11 14 5v27l18 14H3l9-6Z" fill="#071e3b"/></svg>
      <span>Next Customer</span>
    </a>
    <p class="status">Website in progress</p>
  </header>
  <main class="hero" id="main" aria-labelledby="hero-title">
    <div class="hero__inner wrap" id="work">
      <div class="hero__copy">
        <p class="eyebrow">Built by Sergey Kudelin</p>
        <h1 id="hero-title"><span>Meet your</span><span>next customer.</span></h1>
        <p class="description">I'm building Next Customer to help YC-backed startups find their next customers.</p>
        <a class="button" href="https://linkedin.com/in/sergeykudelin">Sergey Kudelin on LinkedIn <svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14" stroke="currentColor" stroke-width="1.7"/></svg></a>
      </div>
    </div>
    <div class="hero__art" aria-hidden="true"><img src="/assets/next-customer.png" width="1254" height="1254" alt="" fetchpriority="high"></div>
  </main>
  <footer class="site-footer wrap">
    <span class="footer-name">Sergey Kudelin</span>
    <a href="mailto:sergey@sergeykudelin.com?subject=Next%20Customer">sergey@sergeykudelin.com</a>
  </footer>
</body>
</html>
